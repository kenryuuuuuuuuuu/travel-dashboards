async function refreshSaveStatus() {
  const statusEl = document.getElementById('saveOfflineStatus');
  if (!statusEl) return;
  if (!SW_SCOPE_OK) return;
  try {
    const reg = await navigator.serviceWorker.getRegistration('./');
    if (!reg || !reg.active) {
      statusEl.textContent = '未保存です。電波のある場所で「旅行用に保存する」を押してください。';
      statusEl.className = 'save-status';
      return;
    }
    const keys = await caches.keys();
    const mine = keys.filter(k => k.startsWith(GUIDE_CACHE_PREFIX));
    if (!mine.length) {
      statusEl.textContent = '未保存です。電波のある場所で「旅行用に保存する」を押してください。';
      statusEl.className = 'save-status';
      return;
    }
    statusEl.textContent = `保存済み（${mine[mine.length - 1]}）。オフラインでも本文・画像をご覧いただけます。`;
    statusEl.className = 'save-status ok';
  } catch (e) {
    statusEl.textContent = '保存状態を確認できませんでした。';
    statusEl.className = 'save-status err';
  }
}

async function runSaveOffline() {
  const statusEl = document.getElementById('saveOfflineStatus');
  const btn = document.getElementById('saveOfflineBtn');
  btn.disabled = true;
  statusEl.className = 'save-status';
  statusEl.textContent = '保存の準備をしています…';
  try {
    const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    statusEl.textContent = '本文・画像を保存しています…（電波の状況により数十秒かかります）';

    const controller = navigator.serviceWorker.controller;
    const result = await new Promise((resolve) => {
      const channel = new MessageChannel();
      channel.port1.onmessage = (ev) => resolve(ev.data);
      const target = reg.active || controller;
      if (!target) { resolve({ ok: false, reason: 'no-controller' }); return; }
      target.postMessage({ type: 'SAVE_FOR_TRIP' }, [channel.port2]);
      setTimeout(() => resolve({ ok: false, reason: 'timeout' }), 45000);
    });

    if (result && result.ok) {
      statusEl.textContent = `保存が完了しました（画像${result.imagesSaved || 0}枚）。機内モードでもご覧いただけます。`;
      statusEl.className = 'save-status ok';
    } else {
      const missing = result && result.missingCount ? `（${result.missingCount}件が未完了）` : '';
      statusEl.textContent = `保存が完了しませんでした${missing}。電波の良い場所で再試行してください。前回までの保存内容は引き続きご利用いただけます。`;
      statusEl.className = 'save-status err';
    }
  } catch (e) {
    console.error(e);
    statusEl.textContent = '保存に失敗しました。電波の良い場所で再試行してください。';
    statusEl.className = 'save-status err';
  } finally {
    btn.disabled = false;
    refreshSaveStatus();
  }
}

/* ============ 12. hashルーティング ============ */
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  if (!h) return { screen: 'trip' };
  const parts = h.split('/');
  if (parts[0] === 'guide' && parts[1] === 'chapter' && parts[2]) return { screen: 'guide', chapterId: decodeURIComponent(parts[2]) };
  if (parts[0] === 'guide' && parts[1]) return { screen: 'article', articleId: decodeURIComponent(parts[1]) };
  if (parts[0] === 'guide') return { screen: 'guide' };
  if (parts[0] === 'tools' && parts[1] === 'search') return { screen: 'tools', query: decodeURIComponent(parts[2] || '') };
  if (parts[0] === 'tools') return { screen: 'tools', toolId: parts[1] };
  if (parts[0] === 'trip' && parts[1]) return { screen: 'trip', date: decodeURIComponent(parts[1]), order: parts[2] ? parseInt(parts[2], 10) : null };
  if (parts[0] === 'near' && parts[1]) return { screen: 'near', date: decodeURIComponent(parts[1]), order: parseInt(parts[2], 10) };
  return { screen: 'trip' };
}

// 旅程の地点の「近くの寄り道」一覧（記事の画面を一覧として使う。戻るで旅程に戻れる）
function openNearPicker(date, order) {
  const day = TRIP.find(t => t.date === date);
  const stop = day && day.stops.find(s => s.order === order);
  const scroll = document.getElementById('articleScroll');
  document.getElementById('articleBackLabel').textContent = '旅程へ戻る';
  if (!stop) {
    scroll.innerHTML = `<div class="no-result">地点が見つかりませんでした。</div>`;
  } else {
    const near = dayNearMap(day).get(order) || [];
    scroll.innerHTML = `<h1 class="a-title-main">${escapeHtml(stop.name)}の近くの寄り道</h1>
      <p class="chapter-lead">旅程の地点から徒歩圏（約${NEAR_KM * 1000}m以内）にある、旅程に入っていない候補です。</p>`
      + near.map(x => articleRowHtml(x.a).replace('<div class="a-arrow" aria-hidden="true">›</div>', `<div class="a-arrow near-dist">${walkHint(x.d).replace(/・/, '<br>')}</div>`)).join('');
    scroll.querySelectorAll('[data-article]').forEach(row => row.addEventListener('click', () => { location.hash = '#guide/' + row.dataset.article; }));
  }
  scroll.scrollTop = 0;
  document.getElementById('articleView').dataset.currentArticle = '';
  document.getElementById('articleView').classList.add('open');
}

let lastRouteWasArticle = false;
function handleRoute() {
  const r = parseHash();
  if (r.screen === 'near') {
    lastRouteWasArticle = true;
    switchScreen('trip', { skipRerender: true });
    openNearPicker(r.date, r.order);
    return;
  }
  if (r.screen === 'article') {
    lastRouteWasArticle = true;
    switchScreen(STATE.articleReturn ? STATE.articleReturn.screen : (STATE.screen === 'trip' ? 'trip' : 'guide'), { skipRerender: true });
    openArticleView(r.articleId);
    return;
  }
  const backFromArticle = lastRouteWasArticle;
  lastRouteWasArticle = false;
  closeArticleView();
  if (backFromArticle && r.screen === 'trip' && !r.date && STATE.screen === 'trip') {
    // 記事から旅程に戻ったときは、描き直さずに元の位置のまま見せる
    return;
  }
  if (r.screen === 'guide') {
    switchScreen('guide', { skipRerender: true });
    if (r.chapterId) renderChapterArticles(r.chapterId);
    else renderGuideHome();
  } else if (r.screen === 'tools') {
    STATE.query = r.query || '';
    switchScreen('tools', { skipRerender: true });
    renderToolsScreen();
  } else {
    switchScreen('trip', { skipRerender: true });
    if (r.date) {
      const dIdx = TRIP.findIndex(t => t.date === r.date);
      if (dIdx >= 0) {
        renderDay(dIdx);
        if (r.order != null) setTimeout(() => scrollToStop(r.order - 1), 260);
      } else {
        renderCurrentTripView();
      }
    } else {
      renderCurrentTripView();
    }
  }
}
window.addEventListener('hashchange', handleRoute);

/* ============ 13. 起動 ============ */
function boot() {
  document.getElementById('tripName').textContent = TRIP_NAME;
  buildRail();
  initGuideExtras();
  updateOnlineBanner();
  // 旅行中は開いた瞬間に「今日」を出す。旅行前後は全体（出発までの日数・確認事項）を出す
  const ti = todayIndex();
  if (ti >= 0) activeDayIndex = ti;
  const restoredScreen = PERSIST.lastScreen;
  if (!location.hash && ti < 0 && restoredScreen && restoredScreen !== 'trip') {
    // 旅行期間外の再訪時は、最後に見ていた画面を復元する（壊れた値は無視）
    if (['guide', 'tools'].includes(restoredScreen)) location.hash = '#' + restoredScreen;
  }
  handleRoute();
  updateStickyH();
  initMapWhenAvailable();
  window.addEventListener('resize', updateStickyH);
  window.addEventListener('load', registerServiceWorker);
  // 「いま」「次」と終わった予定の表示を1分ごと、およびアプリに戻ったときに更新する
  const tick = () => {
    if (STATE.screen !== 'trip' || activeDayIndex < 0) return;
    if (TRIP[activeDayIndex].date !== todayStr()) return;
    renderNextCard(activeDayIndex);
    applyPastState(activeDayIndex);
  };
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}
function initGuideExtras() {
  document.getElementById('guideToc').style.display = window.innerWidth >= 880 ? 'block' : 'none';
  document.getElementById('guidePcTabs').style.display = window.innerWidth >= 880 ? 'flex' : 'none';
  document.getElementById('toolsPcTabs').style.display = window.innerWidth >= 880 ? 'flex' : 'none';
  window.addEventListener('resize', () => {
    document.getElementById('guideToc').style.display = window.innerWidth >= 880 ? 'block' : 'none';
    document.getElementById('guidePcTabs').style.display = window.innerWidth >= 880 ? 'flex' : 'none';
    document.getElementById('toolsPcTabs').style.display = window.innerWidth >= 880 ? 'flex' : 'none';
  });
}
boot();
