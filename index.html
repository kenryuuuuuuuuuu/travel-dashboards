<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅のしおり">
<meta name="theme-color" content="#18222B">
<meta name="robots" content="noindex, nofollow">
<title>旅のしおり</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2318222B'/%3E%3Crect x='4' y='9' width='24' height='14' rx='2' fill='%23E8A317'/%3E%3Cpath d='M21 10v12' stroke='%2318222B' stroke-width='1.4' stroke-dasharray='2 1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"/>
<style>
/* ===== デザイン方針（A案：時刻表と切符）=====
   旅程は「何時に・どこから・どこへ」。予定を一本の路線に見立て、時刻を案内表示のような数字で見せる。
   目立たせるのは「次の予定」の切符だけ。ほかは線と文字だけの静かな時刻表にする（カードや影を増やさない）。 */
:root{
  --paper:#F4F6F5; --ink:#18222B; --ink2:#56626C; --ground:#DCEBE3; --route:#0F6E6A; --amber:#E8A317;
  --rule:#D6DCDA; --done:#9DBFBC;
  /* 既存部品（ガイド・マイページ）が使う名前を、A案の色に割り当てる */
  --bg:var(--paper); --panel:#FFFFFF; --ink-soft:var(--ink2); --line:var(--rule);
  --sky:var(--route); --sky-soft:#3C8C88; --gold:var(--amber); --gold-soft:#F6E3B4; --earth:#8A5A00;
  --alert:#B42318; --alert-bg:#FBE7E4; --ok-bg:#E2EFE8; --ok-ink:#1F6B47; --warn-bg:#FBF0D6; --warn-ink:#7A5200; --hi-bg:#FFF6DF;
  --navh:58px; --stickyh:110px;
  --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right);
  --num:'Barlow Semi Condensed','BIZ UDPGothic',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
/* 画面全体を1本のスクロールにする（枠内スクロールの入れ子をやめる）。
   以前は body を画面の高さに固定し内側をスクロールさせていたため、iOSのPWAで高さの計算がずれる不具合が起きていた。 */
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'BIZ UDPGothic','Hiragino Sans',sans-serif; font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom));
}
body.map-open{ overflow:hidden; }
h1,h2,h3{ font-family:inherit; }
[hidden]{ display:none !important; }
.n{ font-family:var(--num); font-variant-numeric:tabular-nums; letter-spacing:.01em; }
svg.i{ width:18px; height:18px; flex:0 0 18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }
:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto !important; transition:none !important; } }

/* ---- 上部：アプリ名と日付タブ（案内表示の帯） ---- */
.stickyhead{ position:sticky; top:0; z-index:800; background:var(--ink); color:#fff; padding-top:env(safe-area-inset-top); }
.appbar{ display:flex; align-items:center; gap:10px; min-height:46px; padding:2px calc(10px + var(--sr)) 0 calc(16px + var(--sl)); }
.appbar .brand{ display:flex; align-items:center; gap:7px; margin:0; font-size:17px; font-weight:700; letter-spacing:.08em; white-space:nowrap; }
.appbar .brand svg{ color:var(--amber); width:22px; height:22px; flex-basis:22px; }
.appbar .tripname{ flex:1; min-width:0; font-size:12.5px; color:#A9B4BC; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.header-phrase-link{ all:unset; box-sizing:border-box; cursor:pointer; flex:0 0 auto; display:flex; align-items:center; gap:5px;
  font-size:12.5px; color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:4px; padding:0 10px; min-height:36px; white-space:nowrap; }
.daytabs{ display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:0 calc(6px + var(--sr)) 0 calc(6px + var(--sl)); }
.daytabs::-webkit-scrollbar{ display:none; }
body:not([data-screen="trip"]) .daytabs{ display:none; }
.daytab{ all:unset; box-sizing:border-box; cursor:pointer; flex:0 0 auto; min-width:58px; min-height:48px; padding:6px 8px 7px;
  border-bottom:3px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; text-align:center; color:#C9D2D8; }
.daytab .dt-main{ font-family:var(--num); font-variant-numeric:tabular-nums; font-size:19px; font-weight:600; color:#fff; }
.daytab .dt-sub{ font-size:11px; white-space:nowrap; }
.daytab.ov .dt-main{ font-family:inherit; font-size:14px; font-weight:700; padding-top:3px; }
.daytab.today .dt-sub{ color:var(--amber); font-weight:700; }
.daytab.active{ border-bottom-color:var(--amber); }
.daytab.active .dt-main{ color:var(--amber); }
.offline-banner{ background:var(--amber); color:var(--ink); font-size:12.5px; font-weight:700; text-align:center; padding:4px 16px; }

.app{ display:none; }
.app.screen-active{ display:block; }

/* ---- 日の見出し ---- */
.dayhead{ padding:16px calc(18px + var(--sr)) 12px calc(18px + var(--sl)); }
.dh-date{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; font-size:13.5px; color:var(--ink2); }
.dh-big{ font-size:32px; font-weight:700; color:var(--ink); line-height:1; }
.dh-today{ font-size:12px; font-weight:700; color:var(--ink); background:var(--amber); padding:1px 7px; border-radius:3px; }
.dayhead h2{ margin:6px 0 2px; font-size:22px; line-height:1.35; letter-spacing:.02em; }
.dayhead .highlight{ margin:0; font-size:14px; color:var(--ink2); }
.facts{ display:flex; flex-wrap:wrap; gap:4px 16px; margin:10px 0 0; padding:0; list-style:none; font-size:13.5px; color:var(--ink2); }
.facts .contents{ display:contents; }
.fact{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.fact .n{ font-size:17px; font-weight:600; color:var(--ink); }
.fact.alert, .fact.alert .n{ color:var(--alert); font-weight:700; }
.fact.muted{ color:var(--ink2); }
.fact .lv-楽{ color:var(--ok-ink); } .fact .lv-中{ color:var(--earth); } .fact .lv-ハード{ color:var(--alert); }
.fact .wxi svg{ width:20px; height:20px; }

/* ---- ボタン ---- */
.btn{ all:unset; box-sizing:border-box; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:44px; padding:0 16px; border-radius:4px; font-size:14px; font-weight:700; text-align:center; }
.btn.primary{ background:var(--route); color:#fff; }
.btn.primary:active{ background:#0B5754; }
.btn.ghost{ border:1.5px solid var(--route); color:var(--route); }
.btn.ghost:active{ background:#E7F1EF; }

/* ---- いま・次（今日だけ） ---- */
.nextcard{ padding:0 calc(14px + var(--sr)) 0 calc(14px + var(--sl)); }
.nowline{ margin:0 4px; padding:8px 0; border-top:1px solid var(--rule); font-size:13.5px; color:var(--ink2); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
.nowline b{ color:#B07A00; }
.nowline .n{ font-size:16px; font-weight:600; color:var(--ink); }
/* 次の予定＝切符（地紋・ミシン目・半券） */
.ticket{ position:relative; display:grid; grid-template-columns:minmax(0,1fr) 92px; margin-top:4px; border-radius:6px;
  background:var(--ground) repeating-linear-gradient(135deg, rgba(15,110,106,.06) 0 2px, transparent 2px 7px); }
.ticket::before, .ticket::after{ content:""; position:absolute; right:84px; width:16px; height:16px; border-radius:50%; background:var(--paper); }
.ticket::before{ top:-8px; } .ticket::after{ bottom:-8px; }
.t-main{ padding:12px 12px 10px 16px; min-width:0; }
.t-label{ font-size:12px; font-weight:700; color:var(--route); }
.t-time{ font-family:var(--num); font-variant-numeric:tabular-nums; font-size:50px; font-weight:700; line-height:.95; margin-top:2px; }
.t-act{ font-size:18px; font-weight:700; line-height:1.4; margin-top:6px; }
.t-mode{ display:flex; align-items:center; gap:5px; font-size:13px; color:var(--ink2); margin-top:3px; }
.t-stub{ border-left:2px dashed rgba(24,34,43,.3); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 4px; text-align:center; line-height:1.05; }
.t-stub small{ font-size:12px; color:var(--ink2); margin-bottom:2px; }
.t-stub .n{ font-size:30px; font-weight:700; color:var(--route); }
.t-stub .u{ font-size:12px; font-weight:700; color:var(--route); margin-left:1px; }
.t-actions{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; padding:0 14px 14px 16px; }
.dayend{ margin:0 4px; padding:10px 0; border-top:1px solid var(--rule); font-size:14px; }
.dayend p{ margin:2px 0 0; color:var(--ink2); font-size:13px; }

/* ---- 確認・手配が必要な予定（全体画面） ---- */
.prep{ margin:12px calc(14px + var(--sr)) 0 calc(14px + var(--sl)); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.prep summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; min-height:48px; font-weight:700; font-size:15px; padding:0 4px; }
.prep summary::-webkit-details-marker{ display:none; }
.prep summary .n{ font-size:20px; color:var(--alert); }
.prep summary::after{ content:"開く"; margin-left:auto; font-size:12.5px; font-weight:400; color:var(--route); }
.prep[open] summary::after{ content:"閉じる"; }
.prep-row{ display:grid; grid-template-columns:62px minmax(0,1fr); gap:8px; padding:9px 4px; border-top:1px solid var(--rule); cursor:pointer; font-size:14px; }
.prep-row:active{ background:var(--hi-bg); }
.pr-date{ color:var(--ink2); font-size:12px; line-height:1.3; }
.pr-date .n{ display:block; font-size:16px; font-weight:600; color:var(--ink); }

/* ---- 地図（スマホ：小さく表示しタップで全画面／PC：右側に固定） ---- */
.mapcol{ padding:12px calc(14px + var(--sr)) 0 calc(14px + var(--sl)); }
.mapwrap{ position:relative; height:190px; border-radius:6px; overflow:hidden; border:1px solid var(--rule); background:#E8EEF0; }
.mapwrap.ov{ height:230px; }
#map{ position:absolute; inset:0; background:#E8EEF0; }
.sketch{ position:absolute; inset:0; width:100%; height:100%; display:block; background:#DCE7EC; z-index:2; }
.sketch .land{ fill:#F7F7F2; stroke:#C9D1CF; stroke-width:.8; }
.sketch .seg{ fill:none; stroke:var(--route); stroke-width:3; stroke-linecap:round; }
.sketch .seg.fly{ stroke-dasharray:6 6; stroke-width:2; }
.sketch .seg.rail{ stroke-dasharray:9 4; }
.sketch .seg.foot{ stroke:#B07A00; }
.sketch .pin circle{ fill:#fff; stroke:var(--route); stroke-width:2.5; }
.sketch .pin.prec-推定 circle{ stroke-dasharray:3 2; }
.sketch .pin.prec-未定 circle{ stroke:var(--alert); stroke-dasharray:3 2; }
.sketch .pin text{ font-family:var(--num); font-weight:700; font-size:12px; fill:var(--ink); text-anchor:middle; dominant-baseline:central; }
.sketch .lbl{ font-size:11.5px; fill:var(--ink); paint-order:stroke; stroke:#fff; stroke-width:3px; }
.sketch-note{ position:absolute; left:8px; top:8px; z-index:6; font-size:11.5px; font-weight:700; color:var(--ink); background:rgba(255,255,255,.92); padding:2px 8px; border-radius:3px; pointer-events:none; }
.mapwrap.full .sketch-note{ top:calc(14px + env(safe-area-inset-top)); left:auto; right:calc(10px + var(--sr)); }
.map-tap{ all:unset; position:absolute; inset:0; z-index:5; cursor:pointer; }
.map-hint{ position:absolute; right:8px; bottom:8px; z-index:6; pointer-events:none; background:rgba(255,255,255,.94);
  border-radius:3px; padding:2px 8px; font-size:12px; font-weight:700; color:var(--route); }
.map-close{ display:none; }
.mapwrap.full{ position:fixed; inset:0; height:auto; border-radius:0; border:0; z-index:1000; overscroll-behavior:contain; }
.mapwrap.full .map-tap, .mapwrap.full .map-hint{ display:none; }
.mapwrap.full .map-close{ all:unset; box-sizing:border-box; cursor:pointer; position:absolute; z-index:10; display:flex; align-items:center; gap:6px;
  top:calc(10px + env(safe-area-inset-top)); left:calc(10px + var(--sl)); min-height:44px; padding:0 16px; border-radius:4px;
  background:var(--ink); color:#fff; font-weight:700; font-size:14px; }
.mapwrap:not(.full) .route-label{ display:none; }
.mapwrap:not(.full) .maplibregl-ctrl-group{ display:none; }

/* ---- 時刻表（予定を一本の路線に見立てる） ---- */
.timeline{ padding:16px 0 8px; }
.tt{ list-style:none; margin:0; padding:0 calc(16px + var(--sr)) 0 calc(6px + var(--sl)); }
.tt > li{ display:grid; grid-template-columns:62px 28px minmax(0,1fr); position:relative; }
.tt > li::before{ content:""; position:absolute; left:74.5px; top:0; bottom:0; width:3px; background:var(--route); }
.tt > li:first-child::before{ top:14px; }
.tt > li:last-child::before{ bottom:auto; height:14px; }
.tt > li.past::before{ background:var(--done); }
.tt .tcol{ grid-column:1; text-align:right; padding-right:10px; }
.tt .mark{ grid-column:2; position:relative; z-index:1; }
.tt .body{ grid-column:3; padding-left:10px; min-width:0; }
/* 地点（駅） */
.station{ padding-top:2px; scroll-margin-top:calc(var(--stickyh) + 8px); transition:background .3s; }
.station.hi{ background:var(--hi-bg); }
/* 地点の番号（地図のピンと同じ番号。駅ナンバリングのように路線の上に置く） */
.station .num{ position:absolute; left:2px; top:0; width:24px; height:24px; border-radius:50%; background:#fff; border:2.5px solid var(--route); box-sizing:border-box;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; line-height:1; color:var(--ink); }
.station.prec-推定 .num{ border-style:dashed; }
.station.prec-未定 .num{ border:2.5px dashed var(--alert); color:var(--alert); }
.station.past .num{ background:var(--done); border:2.5px solid var(--done); color:#fff; }
.station.cur .num{ background:var(--amber); border:2.5px solid var(--amber); color:var(--ink); box-shadow:0 0 0 4px rgba(232,163,23,.25); }
.station .body{ display:flex; align-items:flex-start; gap:8px; padding-bottom:6px; }
.sname{ all:unset; box-sizing:border-box; cursor:pointer; flex:1; min-width:0; min-height:30px; font-weight:700; font-size:16.5px; line-height:1.45; }
.station.past .sname{ color:#8C979F; }
.navbtn{ all:unset; box-sizing:border-box; flex:0 0 auto; cursor:pointer; display:inline-flex; align-items:center; gap:4px; min-height:32px; padding:0 9px;
  border:1px solid var(--rule); border-radius:4px; background:#fff; font-size:12.5px; font-weight:700; color:var(--route); white-space:nowrap; }
.navbtn svg{ width:14px; height:14px; flex-basis:14px; }
.navbtn:active{ background:#E7F1EF; }
/* 予定 */
.item{ padding:2px 0 12px; }
.item .tcol{ line-height:1.15; padding-top:2px; }
.item .tcol .n{ display:block; font-size:21px; font-weight:600; }
.item .tcol .end{ display:block; font-size:12.5px; color:var(--ink2); }
.item .mark::after{ content:""; position:absolute; left:8px; top:9px; width:8px; height:8px; border-radius:50%; background:#fff; border:2px solid var(--route); }
.item.t-meal .mark::after{ border-color:#3E8E54; } .item.t-flight .mark::after{ border-color:#7A5BB0; }
.item.t-field .mark::after{ border-color:var(--amber); } .item.t-todo .mark::after{ border-color:var(--alert); }
.item .act{ font-size:15.5px; line-height:1.45; }
.item .memo{ font-size:13.5px; color:var(--ink2); margin-top:3px; line-height:1.65; overflow-wrap:anywhere; }
.item .memo.clamp{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.memo-more{ all:unset; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--route); min-height:28px; display:inline-flex; align-items:center; }
.item.past .tcol, .item.past .body{ color:#8C979F; }
.item.past .tcol .end, .item.past .memo{ color:#A5AEB4; }
.item.current .tcol .n{ color:#B07A00; }
.item.current .act{ font-weight:700; }
.item.current .body{ background:var(--hi-bg); border-radius:3px; padding:2px 6px 4px 10px; margin-left:4px; }
.tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
.tag{ font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:3px; white-space:nowrap; }
.tag.alert{ background:var(--alert-bg); color:var(--alert); }
.tag.warn{ background:var(--warn-bg); color:var(--warn-ink); }
.tag.ok{ background:var(--ok-bg); color:var(--ok-ink); }
.tag.neutral{ background:#E8ECEB; color:var(--ink2); }
/* 区間 */
.leg .body{ display:flex; align-items:center; gap:6px; padding:0 0 12px 10px; font-size:13px; color:var(--route); }
.leg.past .body{ color:#8DAAA7; }
.leg.est .leg-tx::after{ content:"（概算）"; color:var(--earth); }
.guide-row .body{ padding-bottom:12px; }
.tl-note{ font-size:12px; color:var(--ink2); padding:12px calc(18px + var(--sr)) 4px calc(18px + var(--sl)); }

/* ---- 全体画面：路線図と日別の時刻表 ---- */
.ov-title{ margin:0 !important; font-size:24px !important; }
.ov-period{ margin:2px 0 0; font-size:13.5px; color:var(--ink2); }
.ov-period .n{ font-size:17px; font-weight:600; color:var(--ink); }
.rmap{ display:flex; margin:16px -6px 4px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; }
.rmap::-webkit-scrollbar{ display:none; }
.rmap .st{ flex:1 0 52px; text-align:center; position:relative; padding-top:22px; }
.rmap .st .l, .rmap .st .r{ position:absolute; top:8px; height:3px; width:50%; background:var(--route); }
.rmap .st .l{ left:0; } .rmap .st .r{ left:50%; }
.rmap .st .fly{ height:2px; top:9px; background:repeating-linear-gradient(90deg, var(--route) 0 5px, transparent 5px 9px); }
.rmap .st .done{ background:var(--done); }
.rmap .st .fly.done{ background:repeating-linear-gradient(90deg, var(--done) 0 5px, transparent 5px 9px); }
.rmap .st i{ position:absolute; top:2px; left:50%; margin-left:-8px; width:16px; height:16px; border-radius:50%; background:var(--paper); border:3px solid var(--route); box-sizing:border-box; z-index:1; }
.rmap .st.done i{ background:var(--done); border-color:var(--done); }
.rmap .st.cur i{ background:var(--amber); border-color:var(--amber); box-shadow:0 0 0 4px rgba(232,163,23,.25); }
.rmap b{ display:block; font-size:13.5px; margin-top:4px; white-space:nowrap; }
.rmap small{ display:block; font-size:11.5px; color:var(--ink2); line-height:1.3; }
.rmap small .n{ font-size:13px; }
.ov-status{ margin-top:12px; padding:10px 12px; background:var(--ground); border-radius:6px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:14.5px; }
.ov-status .n{ font-size:24px; font-weight:700; margin:0 2px; }
.days{ list-style:none; margin:0; padding:0; border-top:1px solid var(--rule); }
.dayrow{ display:grid; grid-template-columns:62px minmax(0,1fr) auto; gap:8px; align-items:center; padding:11px calc(16px + var(--sr)) 11px var(--sl); border-bottom:1px solid var(--rule); cursor:pointer; min-height:60px; }
.dayrow:active{ background:var(--hi-bg); }
.dayrow time{ text-align:right; line-height:1.1; }
.dayrow time .n{ display:block; font-size:20px; font-weight:600; }
.dayrow time small{ font-size:11px; color:var(--ink2); }
.dayrow b{ display:block; font-size:15px; line-height:1.4; }
.dayrow p{ margin:0; font-size:13px; color:var(--ink2); line-height:1.5; }
.dayrow.done{ opacity:.55; }
.dayrow.cur{ background:var(--hi-bg); }
.dayrow.cur time .n{ color:#B07A00; }
.dc-wx{ text-align:center; font-size:11.5px; color:var(--ink2); line-height:1.2; }
.dc-wx svg{ width:22px; height:22px; display:block; margin:0 auto; }

.pin{
  width:26px; height:26px; border-radius:50%; background:#fff; color:var(--ink); border:3px solid var(--route);
  display:flex; align-items:center; justify-content:center;

.pin.prec-推定{ border-style:dashed; }

/* 番号ピンは常に区間ラベルより手前に出す（ラベルは経路計算の後から追加されるため、何もしないと上に重なる） */

/* ============ 1. コアロジック（core_logic.js と同一） ============ */
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function classifyMove(moveText) {
  const t = (moveText || "").trim();
  if (!t || t === "-") return "none";
  if (t.includes("飛行機")) return "flight";
  // 鉄道を含む区間（「鉄道（台鉄）＋タクシー」等の組み合わせも）は鉄道として扱う。所要時間はタイムラインの発着時刻が正
  if (["鉄道", "MRT", "地下鉄", "モノレール", "ゆいレール", "高鉄", "台鉄", "新幹線"].some(k => t.includes(k))) return "rail";
  if (t.includes("馬") && !t.includes("車")) return "horse";
  if (t.includes("ラクダ")) return "camel";
  if (t.includes("徒歩") && !t.includes("車") && !t.includes("タクシー")) return "foot";
  if (t.includes("車") || t.includes("タクシー") || t.includes("送迎") || t.includes("バス")) return "driving";
  return "unknown";
}
const TYPICAL_SPEED_KMH = { horse: 6, camel: 5 };
const WALK_KMH = 4.5;
function estimateNonRoutable(kind, straightKm) {
  const distKm = straightKm * 1.15;
  const speed = TYPICAL_SPEED_KMH[kind] || 5;
  return { distanceKm: distKm, durationMin: (distKm / speed) * 60, source: "estimate" };
}
function fallbackRoute(kind, lat1, lon1, lat2, lon2) {
  const straight = haversineKm(lat1, lon1, lat2, lon2);
  if (kind === "foot") {
    const distKm = straight * 1.25;
    return { distanceKm: distKm, durationMin: (distKm / WALK_KMH) * 60, source: "estimate" };
  }
  if (kind === "driving") {
    const speedKmh = straight > 100 ? 55 : 35;
    const distKm = straight * 1.35;
    return { distanceKm: distKm, durationMin: (distKm / speedKmh) * 60, source: "estimate" };
  }
  return estimateNonRoutable(kind, straight);
}
function summarizeDay(legs) {
  let walkKm = 0, walkMin = 0, driveMin = 0, flightCount = 0, railCount = 0, otherMin = 0, anyEstimate = false;
  for (const leg of legs) {
    if (leg.source === "estimate") anyEstimate = true;
    if (leg.kind === "foot") { walkKm += leg.distanceKm; walkMin += leg.durationMin; }
    else if (leg.kind === "driving") { driveMin += leg.durationMin; }
    else if (leg.kind === "flight") { flightCount += 1; }
    else if (leg.kind === "rail") { railCount += 1; }
    else if (leg.kind === "horse" || leg.kind === "camel") { otherMin += leg.durationMin; }
  }
  const driveHours = driveMin / 60;
  let level = "楽";
  if (walkKm >= 5 || driveHours >= 4) level = "ハード";
  else if (walkKm >= 2 || driveHours >= 2) level = "中";
  return {
    walkKm: Math.round(walkKm * 10) / 10, walkMin: Math.round(walkMin),
    driveHours: Math.round(driveHours * 10) / 10, flightCount, railCount,
    otherMin: Math.round(otherMin), level, hasEstimate: anyEstimate,
  };
}

function ymd(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function parseDayDate(str) {
  const [y, m, d] = str.split('/').map(Number);
  return new Date(y, m - 1, d);
}
function toDateOnly(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

const WX_FORECAST_MAX_DAYS = 15; // Open-Meteoの日次予報が安定して取れる目安の日数
const weatherCache = new Map();

async function callOpenMeteo(base, lat, lon, dateStr, withPrecip) {
  // 降水確率は予報APIにしかない（過去データAPIに付けるとエラーになる）
  const daily = 'weathercode,temperature_2m_max,temperature_2m_min' + (withPrecip ? ',precipitation_probability_max' : '');
  const url = `${base}?latitude=${lat}&longitude=${lon}&start_date=${dateStr}&end_date=${dateStr}&daily=${daily}&timezone=auto`;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if (!res.ok) throw new Error("bad status " + res.status);
    const data = await res.json();
    const tmax = data?.daily?.temperature_2m_max?.[0];
    const tmin = data?.daily?.temperature_2m_min?.[0];
    const code = data?.daily?.weathercode?.[0];
    if (tmax == null || tmin == null || code == null) return { status: "unavailable" };
    const pp = data?.daily?.precipitation_probability_max?.[0];
    return { status: "ok", tmax, tmin, code, pp: pp == null ? null : pp };
  } catch (e) {
    clearTimeout(t);
    return { status: "error" };
  }
}

async function fetchWeather(day) {
  if (!day.weather) return { status: "unavailable" };
  const target = parseDayDate(day.date);
  const today = toDateOnly(new Date());
  const diffDays = Math.round((target - today) / 86400000);
  const dateStr = ymd(target);
  const cacheKey = `${dateStr}:${day.weather.lat},${day.weather.lon}`;
  if (weatherCache.has(cacheKey)) return weatherCache.get(cacheKey);

  let result;
  if (diffDays > WX_FORECAST_MAX_DAYS) {
    result = { status: "too_future", availableInDays: diffDays - WX_FORECAST_MAX_DAYS };
  } else if (diffDays >= 0) {
    result = await callOpenMeteo("https://api.open-meteo.com/v1/forecast", day.weather.lat, day.weather.lon, dateStr, true);
  } else {
    result = await callOpenMeteo("https://archive-api.open-meteo.com/v1/archive", day.weather.lat, day.weather.lon, dateStr);
  }
  weatherCache.set(cacheKey, result);
  return result;
}

function wxIconHtml(code) {
  const cat = wxCategory(code);
  return `<span class="wx-icon-${cat}">${WX_ICON[cat === "mclear" ? "clear" : cat]}</span>`;
}

// 天気は日の見出しの1行目に出す（夜を過ごす場所の天気）
async function renderWeather(day, myGen) {
  const el = document.getElementById('wxFact');
  if (!el) return;
  if (!day.weather) { el.hidden = true; return; }
  el.className = 'fact muted';
  el.textContent = '天気を確認中…';
  const wx = await fetchWeather(day);
  if (myGen !== renderGeneration) return; // 日付が切り替わっていたら古い応答は捨てる
  if (wx.status === "ok") {
    const cat = wxCategory(wx.code);
    el.className = 'fact';
    el.title = `${day.weather.place}の天気`;
    el.innerHTML = `<span class="wxi">${wxIconHtml(wx.code)}</span>${WX_LABEL[cat]} <span class="n">${Math.round(wx.tmax)}°/${Math.round(wx.tmin)}°</span>`;
    // 降水確率は別の項目として並べる
    if (wx.pp != null) el.insertAdjacentHTML('afterend', `<li class="fact" title="降水確率">${svgIcon('umb')}<span class="n">${Math.round(wx.pp)}%</span></li>`);
  } else if (wx.status === "too_future") {
    el.textContent = `天気予報はあと${wx.availableInDays}日ほどで表示`;
  } else if (wx.status === "unavailable") {
    el.hidden = true;
  } else {
    el.textContent = '天気を取得できませんでした';
  }
}

/* ============ 2. OSRM フェッチ（キャッシュ付き） ============ */
const routeCache = new Map();
async function fetchRoute(profile, lat1, lon1, lat2, lon2) {
  const key = `${profile}:${lat1.toFixed(5)},${lon1.toFixed(5)}:${lat2.toFixed(5)},${lon2.toFixed(5)}`;
  if (routeCache.has(key)) return routeCache.get(key);
  const url = `https://router.project-osrm.org/route/v1/${profile}/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`;
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if (!res.ok) throw new Error("bad status " + res.status);
    const data = await res.json();
    if (!data.routes || !data.routes.length) throw new Error("no route");
    const route = data.routes[0];
    // 公開デモサーバーは車のプロファイルしか持たず、foot指定でも車の所要時間が返る。徒歩は距離だけ使い時間は歩行速度で計算する
    const result = {
      distanceKm: route.distance / 1000,
      durationMin: profile === "foot" ? (route.distance / 1000 / WALK_KMH) * 60 : route.duration / 60,
      coords: route.geometry.coordinates.map(([lon, lat]) => [lat, lon]),
      source: "osrm",
    };
    routeCache.set(key, result);
    return result;
  } catch (e) {
    const fb = fallbackRoute(profile === "foot" ? "foot" : "driving", lat1, lon1, lat2, lon2);
    fb.coords = [[lat1, lon1], [lat2, lon2]];
    routeCache.set(key, fb);
    return fb;
  }
}

/* ============ 3. MapLibre GL 初期化（OpenFreeMap、APIキー不要） ============ */
/* 地図の読み込みに失敗しても、旅程の文字情報・ガイドは独立して動作する（設計方針）。*/
let map = null;
function showMapUnavailable() {
  // 地図サービスに届かないときは、内蔵の略地図に切り替える
  mapFailed = true;
  drawCurrentMap();
}
function initMapWhenAvailable() {
  if (typeof maplibregl === 'undefined') { showMapUnavailable(); return; }
  try {
    const first = TRIP[0] && TRIP[0].stops[0];
    map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/positron', // 落ち着いた配色（旅程の線と番号を埋もれさせない）
      center: first ? [first.lon, first.lat] : [135.0, 35.0], // [lng, lat] の順
      zoom: 4,
      attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
    applyMapMode();
    map.on('load', () => {
      mapReady = true;
      mapFailed = false; // 回線が遅く一度「読み込めない」と判定した後に届いた場合も、本物の地図に戻す
      // 出典表示は（i）ボタンに畳む。小さな地図では操作を止めているため、自動では畳まれない
      document.querySelectorAll('.maplibregl-ctrl-attrib.maplibregl-compact-show').forEach(el => el.classList.remove('maplibregl-compact-show'));
      // 画面全体は描き直さず、地図の部分だけを描く（読み込み中にスクロールした位置を戻さないため）
      drawCurrentMap();
    });
    map.on('moveend', scheduleDeclutter);
    map.on('resize', scheduleDeclutter);
    map.on('error', (e) => { console.warn('map error', e && e.error); });
    const timeoutId = setTimeout(() => { if (!mapReady) showMapUnavailable(); }, 9000);
    map.on('load', () => clearTimeout(timeoutId));
  } catch (e) {
    console.error('地図の初期化に失敗しました', e);
    map = null;
    showMapUnavailable();
  }
}

let mapMarkers = [];
let mapLineIds = [];
let lineIdSeq = 0;

function clearMap() {
  mapMarkers.forEach(m => m.remove());
  mapMarkers = [];
  if (map) {
    mapLineIds.forEach(id => {
      if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(id)) map.removeSource(id);
    });
  }
  mapLineIds = [];
}

function pinEl(number, precision) {
  const cls = precision === "推定" ? "prec-推定" : (precision === "未定" ? "prec-未定" : "");
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="pin ${cls}">${number}</div>`;
  return wrap.firstElementChild;
}
function dayChipEl(dayNum) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="pin day">${dayNum}日目</div>`;
  return wrap.firstElementChild;
}
function addMarker(lat, lon, el, popupHtml, onClick) {
  if (!map || !mapReady) return null;
  const marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([lon, lat]).addTo(map);
  if (popupHtml) marker.setPopup(new maplibregl.Popup({ offset: 16 }).setHTML(popupHtml));
  if (onClick) el.addEventListener('click', onClick);
  mapMarkers.push(marker);
  return marker;
}
function addLabelMarker(lat, lon, html) {
  if (!map || !mapReady) return null;
  const el = document.createElement('div');
  el.className = "route-label";
  el.innerHTML = html; // 呼び出し側で文字列部分をエスケープ済み
  const marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([lon, lat]).addTo(map);
  mapMarkers.push(marker);
  return marker;
}
function addLine(coordsLatLon, style) {
  if (!map || !mapReady) return null;
  const id = 'line-' + (lineIdSeq++);
  const geojson = {
    type: 'Feature', properties: {},
    geometry: { type: 'LineString', coordinates: coordsLatLon.map(([lat, lon]) => [lon, lat]) }
  };
  map.addSource(id, { type: 'geojson', data: geojson });
  const paint = { 'line-color': style.color, 'line-width': style.weight, 'line-opacity': style.opacity };
  if (style.dashArray) paint['line-dasharray'] = style.dashArray;
  map.addLayer({ id, type: 'line', source: id, layout: { 'line-cap': 'round' }, paint });
  mapLineIds.push(id);
  return id;
}
function removeLine(id) {
  if (!map || id == null) return;
  if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource(id)) map.removeSource(id);
  mapLineIds = mapLineIds.filter(x => x !== id);
}
function fitBoundsLatLon(pointsLatLon, opts) {
  if (!map || !mapReady || !pointsLatLon.length) return;
  const bounds = new maplibregl.LngLatBounds();
  pointsLatLon.forEach(([lat, lon]) => bounds.extend([lon, lat]));
  map.fitBounds(bounds, opts);
}

/* ---- 地図の表示モード：スマホは「小さく表示（操作なし）→タップで全画面（操作あり）」、PCは常に操作可 ---- */
// 小さな地図の上で指が地図に吸われて画面をスクロールできなくなるのを防ぐため、小さい間は地図操作を止めている
const WIDE_MQ = window.matchMedia('(min-width: 880px)');
let mapFull = false;
function isWide() { return WIDE_MQ.matches; }
function applyMapMode() {
  if (!map) return;
  const on = isWide() || mapFull;
  ['dragPan', 'scrollZoom', 'boxZoom', 'dragRotate', 'keyboard', 'doubleClickZoom', 'touchZoomRotate', 'touchPitch'].forEach(h => {
    if (map[h]) on ? map[h].enable() : map[h].disable();
  });
}
function mapPadding() { return (isWide() || mapFull) ? 60 : 24; }
function refitCurrentMap() {
  if (!currentView || !currentView.boundsPts.length) return;
  fitBoundsLatLon(currentView.boundsPts, { padding: mapPadding(), maxZoom: currentView.type === 'day' ? 14 : 8, duration: 0 });
}
function openMapFull(stopIndex) {
  if (isWide()) {
    if (stopIndex != null) flyToStop(stopIndex);
    return;
  }
  mapFull = true;
  document.getElementById('mapWrap').classList.add('full');
  document.body.classList.add('map-open');
  applyMapMode();
  if (!liveMapUsable()) { renderSketch(); return; }
  map.resize();
  if (stopIndex != null) flyToStop(stopIndex, 0);
  else refitCurrentMap();
}
function closeMapFull() {
  if (!mapFull) return;
  mapFull = false;
  document.getElementById('mapWrap').classList.remove('full');
  document.body.classList.remove('map-open');
  applyMapMode();
  if (!liveMapUsable()) { renderSketch(); return; }
  map.resize(); refitCurrentMap();
}
function flyToStop(i, duration) {
  if (!map || !mapReady || !currentView || currentView.type !== 'day') return;
  const s = TRIP[currentView.di].stops[i];
  if (!s) return;
  map.flyTo({ center: [s.lon, s.lat], zoom: Math.max(map.getZoom(), 14), duration: duration == null ? 600 : duration });
}
document.getElementById('mapTap').addEventListener('click', () => openMapFull(null));
document.getElementById('mapClose').addEventListener('click', closeMapFull);
function onWideChange() { if (isWide()) closeMapFull(); applyMapMode(); updateStickyH(); if (map) map.resize(); drawCurrentMap(); }
if (WIDE_MQ.addEventListener) WIDE_MQ.addEventListener('change', onWideChange); else WIDE_MQ.addListener(onWideChange);
// 略地図は画面サイズに合わせて描き直す
let sketchResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(sketchResizeTimer);
  sketchResizeTimer = setTimeout(() => { if (!document.getElementById('sketch').hasAttribute('hidden')) renderSketch(); }, 150);
});
// 路線の色に合わせる：徒歩＝琥珀、鉄道＝路線の緑（破線）、車＝墨、空路＝細い点線
function styleForKind(kind) {
  if (kind === "foot") return { color: "#B07A00", weight: 4, dashArray: null, opacity: .9 };
  if (kind === "driving") return { color: "#18222B", weight: 4, dashArray: null, opacity: .75 };
  if (kind === "flight") return { color: "#0F6E6A", weight: 2, dashArray: [2, 2], opacity: .9 };
  if (kind === "rail") return { color: "#0F6E6A", weight: 4, dashArray: [3, 1.2], opacity: .9 };
  if (kind === "horse" || kind === "camel") return { color: "#8A5A00", weight: 3, dashArray: [1, 1.5], opacity: .85 };
  return { color: "#8C979F", weight: 2, dashArray: [1.5, 1.5], opacity: .6 };
}
function fmtDist(km) {
  if (km < 1) return `${Math.max(10, Math.round(km * 100) * 10)}m`;
  return km >= 10 ? `${km.toFixed(0)}km` : `${km.toFixed(1)}km`;
}
function fmtMin(min) {
  if (min >= 60) { const h = Math.floor(min / 60), m = Math.round(min % 60); return m ? `${h}時間${m}分` : `${h}時間`; }
  return `${Math.max(1, Math.round(min))}分`;
}
function kindLabel(kind) {
  return { foot: "徒歩", driving: "車", flight: "空路", rail: "鉄道", horse: "乗馬", camel: "ラクダ", none: "", unknown: "移動" }[kind] || kind;
}
function moveIcon(kind, text) {
  const t = text || "";
  if (kind === "flight") return svgIcon('plane');
  if (kind === "rail") return svgIcon('train');
  if (kind === "foot") return svgIcon('walk');
  if (kind === "driving") return svgIcon(t.includes("バス") && !t.includes("タクシー") ? 'bus' : 'car');
  return svgIcon('move');
}
// 「鉄道（MRT板南線）」→「MRT板南線」、「鉄道（ゆいレール）＋徒歩」→「ゆいレール＋徒歩」のように表示用に短くする
function moveLabel(text) {
  const t = (text || "").trim();
  if (!t || t === "-") return "";
  return t.replace(/鉄道（([^（）]+)）/g, '$1');
}
function legText(kind, res, moveText) {
  const label = moveLabel(moveText) || kindLabel(kind);
  if (kind === "foot") return `${label} ${fmtMin(res.durationMin)}（${fmtDist(res.distanceKm)}）`;
  if (kind === "driving") return `${label} 約${fmtMin(res.durationMin)}（${fmtDist(res.distanceKm)}）`;
  if (kind === "rail") return res.distanceKm >= 0.05 ? `${label}（直線${fmtDist(res.distanceKm)}）` : label;
  if (kind === "flight") return `${label}（約${fmtDist(res.distanceKm)}）`;
  if (kind === "horse" || kind === "camel") return `${label} 約${fmtMin(res.durationMin)}`;
  return label;
}

/* ---- 日付・時刻（端末の現地時刻。スマホは渡航先で自動的に時差を切り替える） ---- */
function todayStr() { const n = new Date(); return `${n.getFullYear()}/${n.getMonth() + 1}/${n.getDate()}`; }
function todayIndex() { return TRIP.findIndex(t => t.date === todayStr()); }
function mdOf(date) { return date.split('/').slice(1).join('/'); }
function dayDateLabel(day) { return `${mdOf(day.date)}（${day.dow}）`; }
function fullDow(dow) { return /^[日月火水木金土]$/.test(dow || '') ? `${dow}曜日` : (dow || ''); }
function shortTitle(i) { return (SHORT_DAY_TITLE[i] || TRIP[i].title || '').replace(/^Day\d+[：:]\s*/, ''); }
function shortHighlight(i) { return SHORT_DAY_HIGHLIGHT[i] || TRIP[i].highlight || ''; }
function dayColor(i) { return DAY_COLORS[i % DAY_COLORS.length]; }
function toMin(hhmm) { const m = /^(\d{1,2}):(\d{2})/.exec(String(hhmm || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
function nowMin() { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
function fmtUntil(min) {
  if (min < 60) return `あと${min}分`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `あと${h}時間${m}分` : `あと${h}時間`;
}
function tripPhase() {
  const t = toDateOnly(new Date());
  const first = parseDayDate(TRIP[0].date), last = parseDayDate(TRIP[TRIP.length - 1].date);
  if (t < first) return { phase: 'before', days: Math.round((first - t) / 86400000) };
  if (t > last) return { phase: 'after' };
  return { phase: 'during', index: todayIndex() };
}

// 行動が必要なものだけをタグにする（「案」「確定」は旅行中に判断材料にならないので出さない）
function itemTags(it) {
  const tags = [];
  const book = String(it.book || '').trim();
  const st = String(it.status || '').trim();
  if (/要予約/.test(book)) tags.push(['alert', '要予約']);
  else if (/要手配/.test(book) || st === '要手配') tags.push(['alert', '要手配']);
  if (st === '要確認') tags.push(['warn', '要確認']);
  if (/予約済|取得済/.test(book)) tags.push(['ok', '✓ ' + book.replace(/（.*?）/g, '')]);
  else if (/予約不可/.test(book)) tags.push(['neutral', '予約不可']);
  return tags;
}
function isActionable(it) { return itemTags(it).some(t => t[0] === 'alert' || t[0] === 'warn'); }
function countActionable(stops) {
  let n = 0;
  stops.forEach(s => s.items.forEach(it => { if (isActionable(it)) n++; }));
  return n;
}
function navUrl(stop) {
  // 地図アプリでの検索語。抽出時に地点名＋地域名で作る。個人宅など出さない地点は空文字
  const q = stop.nav === undefined ? stop.name : stop.nav;
  if (!q) return null;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

/* ============ 4. 1日分の描画 ============ */
let activeDayIndex = -1; // -1 = 全体ルート

// 日の見出しの「その日の負荷」（歩く距離・乗り物・要対応）。カードやチップにせず、アイコンと数字だけで並べる
function renderStatChips(summary, actionable, pending) {

    if (summary.driveHours > 0) f.push(`<li class="fact" title="車">${svgIcon('car')}<span class="n">${summary.driveHours}</span>時間</li>`);
    if (summary.flightCount) f.push(`<li class="fact" title="飛行機">${svgIcon('plane')}<span class="n">${summary.flightCount}</span>便</li>`);

function resolveLegRoute(leg) {
  const { a, b } = leg;
  if (leg.kind === "foot") return fetchRoute("foot", a.lat, a.lon, b.lat, b.lon);
  if (leg.kind === "driving") return fetchRoute("driving", a.lat, a.lon, b.lat, b.lon);
  const straight = haversineKm(a.lat, a.lon, b.lat, b.lon);
  const coords = [[a.lat, a.lon], [b.lat, b.lon]];
  if (leg.kind === "horse" || leg.kind === "camel") return Promise.resolve({ ...estimateNonRoutable(leg.kind, straight), coords });
  if (leg.kind === "flight" || leg.kind === "rail") return Promise.resolve({ distanceKm: straight, durationMin: 0, coords, source: leg.kind });
  return Promise.resolve({ distanceKm: 0, durationMin: 0, coords, source: "none" });
}

// 線の長さに対して割合 f の位置（点の数で半分にすると、2点だけの直線では終点＝到着地のピンの上になってしまう）
function pointAlong(coords, f) {
  if (coords.length < 2) return coords[0];
  let total = 0;
  const seg = [];
  for (let k = 1; k < coords.length; k++) { const d = Math.hypot(coords[k][0] - coords[k - 1][0], coords[k][1] - coords[k - 1][1]); seg.push(d); total += d; }
  let acc = 0;
  const goal = total * f;
  for (let k = 0; k < seg.length; k++) {
    if (acc + seg[k] >= goal) {
      const t = seg[k] ? (goal - acc) / seg[k] : 0;
      const [a, b] = [coords[k], coords[k + 1]];
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }
    acc += seg[k];
  }
  return coords[coords.length - 1];
}
function midpointAlong(coords) { return pointAlong(coords, 0.5); }
// ラベルを置いてみる位置の候補（線の中央から順に、少しずつ前後へずらす）
const LABEL_SPOTS = [0.5, 0.35, 0.65, 0.22, 0.78];

// 1区間分の線とラベルを地図に描く（経路が取れる前は点線の直線）
function drawLeg(leg) {
  if (!map || !mapReady) return;
  if (leg.lineId) { removeLine(leg.lineId); leg.lineId = null; }
  if (leg.labelMarker) { leg.labelMarker.remove(); leg.labelMarker = null; }
  const style = styleForKind(leg.kind);
  if (!leg.res) {
    leg.lineId = addLine([[leg.a.lat, leg.a.lon], [leg.b.lat, leg.b.lon]], { ...style, dashArray: [1, 1.5] });
    return;
  }
  leg.lineId = addLine(leg.res.coords, style);
  if (leg.kind === "none") return;
  if (leg.kind === "rail" && leg.res.distanceKm < 0.05) return;
  const [mlat, mlon] = midpointAlong(leg.res.coords);
  // 地図上のラベルは短く（アイコン＋所要時間だけ）。手段名や距離の詳細は予定リスト側に出ている
  const short = (leg.kind === "foot" || leg.kind === "driving") ? `<span class="n">${escapeHtml(fmtMin(leg.res.durationMin))}</span>` : '';
  leg.labelMarker = addLabelMarker(mlat, mlon, `${moveIcon(leg.kind, leg.move)}${short}`);
  if (leg.labelMarker) leg.labelMarker.spots = LABEL_SPOTS.map(f => pointAlong(leg.res.coords, f));
  scheduleDeclutter();
}

// 区間ラベルが番号ピンや他のラベルと重なるときは、そのラベルを隠す（拡大・移動のたびに判定し直す）
let declutterTimer = null;
function scheduleDeclutter() {
  clearTimeout(declutterTimer);
  declutterTimer = setTimeout(declutterLabels, 60);
}
function declutterLabels() {
  if (!map || !mapReady) return;
  const c = map.getContainer();
  const W = c.clientWidth, H = c.clientHeight;
  const pad = 3;
  const hit = (a, b) => !(a.r < b.l || a.l > b.r || a.b < b.t || a.t > b.b);
  // 地図の中の座標（px）で判定する
  const pins = mapMarkers.filter(m => m.getElement().classList.contains('pin')).map(m => {
    const p = map.project(m.getLngLat());
    const el = m.getElement();
    const hw = el.offsetWidth / 2 + pad, hh = el.offsetHeight / 2 + pad;
    return { l: p.x - hw, r: p.x + hw, t: p.y - hh, b: p.y + hh };
  });
  const kept = [];
  mapMarkers.filter(m => m.getElement().classList.contains('route-label')).forEach(m => {
    const el = m.getElement();
    el.classList.remove('decluttered');
    const w = el.offsetWidth, h = el.offsetHeight;
    if (!w) return; // 小さな地図では非表示（CSS）
    const spots = m.spots || [[m.getLngLat().lat, m.getLngLat().lng]];
    for (const [lat, lon] of spots) {
      const p = map.project([lon, lat]);
      const box = { l: p.x - w / 2 - pad, r: p.x + w / 2 + pad, t: p.y - h / 2 - pad, b: p.y + h / 2 + pad };
      const inside = box.l >= 0 && box.t >= 0 && box.r <= W && box.b <= H;
      if (inside && !pins.some(q => hit(box, q)) && !kept.some(k => hit(box, k))) {
        m.setLngLat([lon, lat]);
        kept.push(box);
        return;
      }
    }
    el.classList.add('decluttered');
  });
}

function drawDayMap() {
  const v = currentView;
  clearMap();
  if (!map || !mapReady || !v || v.type !== 'day') return;
  v.legs.forEach(leg => { leg.lineId = null; leg.labelMarker = null; drawLeg(leg); });
  TRIP[v.di].stops.forEach((s, i) => {
    addMarker(s.lat, s.lon, pinEl(i + 1, s.precision), `<b>${i + 1}. ${escapeHtml(s.name)}</b>`, () => { if (!mapFull) scrollToStop(i); });
  });
  refitCurrentMap();
  scheduleDeclutter();
}
// 本物の地図を使える状態か（電波があり、地図サービスを読み込めている）
function liveMapUsable() { return !!(map && mapReady && !mapFailed && navigator.onLine !== false); }
function drawCurrentMap() {
  if (!currentView) return;
  const live = liveMapUsable();
  // SVG要素は .hidden プロパティを持たないため、属性で切り替える
  document.getElementById('sketch').toggleAttribute('hidden', live);
  // 読み込み中は略地図を仮に出しておく。案内文は「電波がない／地図を読み込めない」ときだけ出す
  document.getElementById('sketchNote').hidden = live || !(mapFailed || navigator.onLine === false);
  if (!live) { renderSketch(); return; }
  if (currentView.type === 'day') drawDayMap();
  else drawOverviewMap();
}

/* ---- 略地図（オフライン用）：海岸線・経路・地点番号をSVGで描く。地図サービスに一切依存しない ---- */
const ringBBoxCache = new WeakMap();
function ringBBox(ring) {
  let bb = ringBBoxCache.get(ring);
  if (!bb) {
    bb = [Infinity, Infinity, -Infinity, -Infinity];
    ring.forEach(([lo, la]) => { bb[0] = Math.min(bb[0], lo); bb[1] = Math.min(bb[1], la); bb[2] = Math.max(bb[2], lo); bb[3] = Math.max(bb[3], la); });
    ringBBoxCache.set(ring, bb);
  }
  return bb;
}
function renderSketch() {
  const svg = document.getElementById('sketch');
  const v = currentView;
  if (!svg || !v) return;
  const W = svg.clientWidth || svg.parentElement.clientWidth || 360;
  const H = svg.clientHeight || svg.parentElement.clientHeight || 200;
  const pts = v.boundsPts;
  if (!pts.length) { svg.innerHTML = ''; return; }
  let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
  pts.forEach(([la, lo]) => { minLat = Math.min(minLat, la); maxLat = Math.max(maxLat, la); minLon = Math.min(minLon, lo); maxLon = Math.max(maxLon, lo); });
  // 地点が1か所に集まっているときも周囲が分かるよう、最低でも約3km四方を表示する
  const minSpan = 0.03;
  if (maxLat - minLat < minSpan) { const c = (maxLat + minLat) / 2; minLat = c - minSpan / 2; maxLat = c + minSpan / 2; }
  if (maxLon - minLon < minSpan) { const c = (maxLon + minLon) / 2; minLon = c - minSpan / 2; maxLon = c + minSpan / 2; }
  const kx = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
  const pad = (isWide() || mapFull) ? 56 : 22;
  const sx = (W - pad * 2) / ((maxLon - minLon) * kx), sy = (H - pad * 2) / (maxLat - minLat);
  const s = Math.min(sx, sy);
  const cx = (minLon + maxLon) / 2, cy = (minLat + maxLat) / 2;
  const X = lo => W / 2 + (lo - cx) * kx * s;
  const Y = la => H / 2 - (la - cy) * s;
  const r1 = n => Math.round(n * 10) / 10;

  let out = '';
  if (BASEMAP) {
    // 広域表示では粗い海岸線、街なかの表示では詳しい海岸線も重ねる
    const spanDeg = Math.max((W / s) / kx, H / s);
    const layers = spanDeg > 3 ? [BASEMAP.coarse] : [BASEMAP.coarse, BASEMAP.fine];
    const view = [cx - (W / 2) / (kx * s), cy - (H / 2) / s, cx + (W / 2) / (kx * s), cy + (H / 2) / s];
    layers.forEach(rings => rings.forEach(ring => {
      const bb = ringBBox(ring);
      if (bb[2] < view[0] || bb[0] > view[2] || bb[3] < view[1] || bb[1] > view[3]) return;
      let d = '';
      ring.forEach(([lo, la], k) => { d += (k ? 'L' : 'M') + r1(X(lo)) + ' ' + r1(Y(la)); });
      out += `<path class="land" d="${d}Z"/>`;
    }));
  }
  if (v.type === 'day') {
    const stops = TRIP[v.di].stops;
    v.legs.forEach(leg => {
      if (leg.kind === 'none') return;
      const cls = leg.kind === 'flight' ? 'fly' : leg.kind === 'rail' ? 'rail' : leg.kind === 'foot' ? 'foot' : '';
      out += `<path class="seg ${cls}" d="M${r1(X(leg.a.lon))} ${r1(Y(leg.a.lat))}L${r1(X(leg.b.lon))} ${r1(Y(leg.b.lat))}"/>`;
    });
    const showLabels = isWide() || mapFull;
    const drawn = [];
    let pinsSvg = '', labelsSvg = '';
    stops.forEach((st, i) => {
      const x = r1(X(st.lon)), y = r1(Y(st.lat));
      // 同じ場所に戻ってくる地点は番号を重ねず、最初の1つだけ描く
      if (drawn.some(([dx, dy]) => Math.abs(dx - x) < 4 && Math.abs(dy - y) < 4)) return;
      drawn.push([x, y]);
      pinsSvg += `<g class="pin prec-${escapeHtml(st.precision)}" data-stop="${i}"><circle cx="${x}" cy="${y}" r="11"/><text x="${x}" y="${y}">${i + 1}</text></g>`;
      // 右寄りの地点は名前を左側に出し、画面の端で切れないようにする
      if (showLabels) labelsSvg += x > W * 0.6
        ? `<text class="lbl" x="${r1(x - 15)}" y="${r1(y + 4)}" text-anchor="end">${escapeHtml(st.name)}</text>`
        : `<text class="lbl" x="${r1(x + 15)}" y="${r1(y + 4)}">${escapeHtml(st.name)}</text>`;
    });
    // 地名を先に、番号ピンを後に描いて、番号が隠れないようにする
    out += labelsSvg + pinsSvg;
  } else {
    TRIP.forEach((day, di) => {
      const p = day.stops;
      for (let k = 1; k < p.length; k++) {
        const fly = classifyMove(p[k].arrive_move) === 'flight';
        out += `<path class="seg${fly ? ' fly' : ''}" d="M${r1(X(p[k - 1].lon))} ${r1(Y(p[k - 1].lat))}L${r1(X(p[k].lon))} ${r1(Y(p[k].lat))}"/>`;
      }
    });
    const showLabels = isWide() || mapFull;
    nightStations().forEach(st => {
      const x = r1(X(st.lon)), y = r1(Y(st.lat));
      out += `<g class="pin"><circle cx="${x}" cy="${y}" r="6"/></g>`;
      if (showLabels) out += `<text class="lbl" x="${r1(x + 10)}" y="${r1(y + 4)}">${escapeHtml(st.name)}</text>`;
    });
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = out;
  svg.querySelectorAll('g[data-stop]').forEach(g => g.addEventListener('click', () => { if (!mapFull) scrollToStop(Number(g.dataset.stop)); }));
}

/* ---- 旅の路線図（宿泊地を駅に見立てる。「都市」列の最後の都市＝その日の宿泊地） ---- */
function nightCityOf(day) {
  const parts = String(day.city || '').split('→').map(t => t.trim()).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : '';
}
function nightStations() {
  if (!TRIP.length) return [];
  const firstParts = String(TRIP[0].city || '').split('→').map(t => t.trim()).filter(Boolean);
  const first = TRIP[0].stops[0];
  const list = [{ name: firstParts[0] || '出発', date: TRIP[0].date, nights: 0, fromDay: 0, toDay: -1, lat: first ? first.lat : 0, lon: first ? first.lon : 0, fly: false }];
  TRIP.forEach((day, di) => {
    if (di === TRIP.length - 1) return;
    const c = nightCityOf(day);
    if (!c) return;
    const last = list[list.length - 1];
    const lastStop = day.stops[day.stops.length - 1] || {};
    if (list.length > 1 && last.name === c) { last.nights++; last.toDay = di; return; }
    const fly = day.stops.some(s => s.items.some(it => it.type === 'flight'));
    list.push({ name: c, date: day.date, nights: 1, fromDay: di, toDay: di, lat: lastStop.lat, lon: lastStop.lon, fly });
  });
  const lastDay = TRIP[TRIP.length - 1];
  const end = lastDay.stops[lastDay.stops.length - 1] || {};
  list.push({ name: nightCityOf(lastDay) || '到着', date: lastDay.date, nights: 0, fromDay: TRIP.length - 1, toDay: TRIP.length - 1,
    lat: end.lat, lon: end.lon, fly: lastDay.stops.some(s => s.items.some(it => it.type === 'flight')), end: true });
  return list;
}

// その日の代わりの案：ガイド記事の catalog.altFor がその日の日付のもの（例：晴れなら日月潭、行かない日の台南）
function altPlansHtml(day) {
  const alts = GUIDE.articles.filter(a => a.catalog && a.catalog.altFor === day.date);
  if (!alts.length) return '';
  return `<div class="altplans">${alts.map(a => `
    <button type="button" class="altplan" data-art="${escapeHtml(a.id)}">
      <span class="tag">${escapeHtml(a.catalog.altTag || 'B案')}</span>
      <span>${escapeHtml(a.catalog.altLabel || a.title)}</span><span class="go" aria-hidden="true">›</span>
    </button>`).join('')}</div>`;
}

async function renderDay(dayIndex, opts) {
  opts = opts || {};
  const myGen = ++renderGeneration;
  activeDayIndex = dayIndex;
  PERSIST.lastDayIndex = dayIndex; savePersisted();
  updateRailActive();
  const day = TRIP[dayIndex];
  const stops = day.stops;
  const isToday = day.date === todayStr();

  document.getElementById('dayHead').innerHTML = `
    <div class="dh-date"><span class="n dh-big">${escapeHtml(mdOf(day.date))}</span><span>${escapeHtml(fullDow(day.dow))}　${dayIndex + 1}日目</span>${isToday ? '<span class="dh-today">今日</span>' : ''}</div>
    <h2>${escapeHtml(shortTitle(dayIndex))}</h2>
    <p class="highlight">${escapeHtml(shortHighlight(dayIndex))}</p>
    <ul class="facts"><li class="fact muted" id="wxFact"></li><span class="contents" id="statChips"></span></ul>${altPlansHtml(day)}`;
  document.querySelectorAll('#dayHead .altplan').forEach(b => b.addEventListener('click', () => {
    STATE.articleReturn = { screen: 'trip', scrollY: window.scrollY };
    location.hash = `#guide/${encodeURIComponent(b.dataset.art)}`;
  }));
  document.getElementById('prepBox').hidden = true;
  document.getElementById('mapWrap').classList.remove('ov');
  renderTimeline(day, stops, dayIndex);
  renderNextCard(dayIndex);
  renderStatChips(null, countActionable(stops), true);
  renderWeather(day, myGen);
  if (!opts.keepScroll) window.scrollTo(0, 0);

  const legs = [];
  for (let i = 1; i < stops.length; i++) {
    legs.push({ idx: i, kind: classifyMove(stops[i].arrive_move), move: stops[i].arrive_move, a: stops[i - 1], b: stops[i], res: null, lineId: null, labelMarker: null });
  }
  currentView = { type: 'day', di: dayIndex, legs, boundsPts: stops.map(s => [s.lat, s.lon]) };
  if (map && mapReady) map.resize();
  drawCurrentMap();

  // 実経路 / 概算を非同期で取得して差し替え
  for (const leg of legs) {
    const res = await resolveLegRoute(leg);
    if (myGen !== renderGeneration) return; // 日付が切り替わっていたら、以降の描画・タイムライン更新を中断する
    leg.res = res;
    drawLeg(leg);
    updateLegInfoInTimeline(leg.idx, res, leg.kind, leg.move);
  }
  if (myGen !== renderGeneration) return;
  renderStatChips(summarizeDay(legs.map(l => ({ kind: l.kind, ...l.res }))), countActionable(stops), false);
}

// その日の予定を時刻順に1列に並べたもの（「いま」「次」「終わった予定」の判定に使う）
function flattenItems(day) {
  const list = [];
  day.stops.forEach((s, si) => s.items.forEach((it, ii) => list.push({ it, s, si, ii, start: toMin(it.start), end: toMin(it.end) })));
  list.forEach((x, k) => {
    // 終了時刻が空の予定は、次の予定の開始時刻で終わったとみなす
    const nextStart = list.slice(k + 1).map(y => y.start).find(v => v != null);
    x.effEnd = x.end != null ? x.end : (nextStart != null ? nextStart : null);
  });
  return list;
}
function nowNext(day) {
  const list = flattenItems(day);
  const n = nowMin();
  const next = list.find(x => x.start != null && x.start > n) || null;
  const current = list.filter(x => x.start != null && x.start <= n && (x.effEnd == null || n < x.effEnd)).pop() || null;
  return { list, current, next, n };
}

function itemHtml(it, si, ii) {
  const tags = itemTags(it);
  const memo = String(it.memo || '').trim();
  const longMemo = memo.length > 54;
  return `
    <li class="item t-${it.type}" data-si="${si}" data-ii="${ii}">
      <time class="tcol"><span class="n">${escapeHtml(it.start || '')}</span>${it.end ? `<span class="end">〜<span class="n">${escapeHtml(it.end)}</span></span>` : ''}</time>
      <span class="mark" aria-hidden="true"></span>
      <div class="body">
        <div class="act">${escapeHtml(it.act)}</div>
        ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag ${t[0]}">${escapeHtml(t[1])}</span>`).join('')}</div>` : ''}
        ${memo ? `<div class="memo${longMemo ? ' clamp' : ''}">${escapeHtml(memo)}</div>` : ''}
        ${longMemo ? `<button type="button" class="memo-more">続きを読む</button>` : ''}
      </div>
    </li>`;
}

// 予定を一本の路線として描く：地点＝駅（丸）、予定＝時刻、区間＝線の上の移動手段
function renderTimeline(day, stops, dayIndex) {
  const el = document.getElementById('timeline');
  const nearMap = dayNearMap(day);
  let html = '<ol class="tt">';
  stops.forEach((s, i) => {
    if (i > 0) {
      const kind = classifyMove(s.arrive_move);
      html += `<li class="leg" id="leg-${i}" data-to="${i}"${kind === 'none' ? ' hidden' : ''}><span class="tcol"></span><span class="mark"></span><div class="body">${moveIcon(kind, s.arrive_move)}<span class="leg-tx">${escapeHtml(moveLabel(s.arrive_move) || kindLabel(kind))}</span></div></li>`;
    }
    const stopKey = day.date + '#' + s.order;
    const articleIds = STOP_ARTICLE_INDEX.get(stopKey) || [];
    const nav = navUrl(s);
    html += `
      <li class="station prec-${escapeHtml(s.precision)}" id="stop-${i}">
        <span class="tcol"></span><span class="mark" aria-hidden="true"><span class="num n">${i + 1}</span></span>
        <div class="body">
          <button type="button" class="sname" data-stop="${i}" aria-label="${i + 1}番 ${escapeHtml(s.name)}を地図で見る">${escapeHtml(s.name)}</button>
          ${nav ? `<a class="navbtn" href="${escapeHtml(nav)}" target="_blank" rel="noopener">${svgIcon('open')}地図</a>` : ''}
        </div>
      </li>`;
    html += s.items.map((it, ii) => itemHtml(it, i, ii)).join('');
    const near = nearMap.get(s.order) || [];
    if (articleIds.length || near.length) {
      html += `<li class="guide-row" data-si="${i}"><span class="tcol"></span><span class="mark"></span><div class="body">`
        + (articleIds.length ? `<button type="button" class="stop-guide-btn" data-stop-key="${escapeHtml(stopKey)}" data-stop-index="${i}">${svgIcon('book')}この場所のガイド${articleIds.length > 1 ? `（${articleIds.length}件）` : ''}</button>` : '')
        + (near.length ? `<button type="button" class="stop-guide-btn near" data-near-date="${escapeHtml(day.date)}" data-near-order="${s.order}">近くの寄り道 ${near.length}件<span class="near-names">${escapeHtml(near.slice(0, 2).map(x => x.a.title.replace(/（.*?）/g, '')).join('、'))}${near.length > 2 ? 'ほか' : ''}</span></button>` : '')
        + `</div></li>`;
    }
  });
  html += '</ol>';
  html += `<div class="tl-note">距離・時間は目安です。鉄道の所要時間は各予定の時刻をご覧ください。</div>`;
  el.innerHTML = html;

  el.querySelectorAll('.sname').forEach(b => b.addEventListener('click', () => openMapFull(Number(b.dataset.stop))));
  el.querySelectorAll('.memo-more').forEach(b => b.addEventListener('click', () => {
    const memo = b.parentElement.querySelector('.memo');
    if (memo) memo.classList.remove('clamp');
    b.remove();
  }));
  el.querySelectorAll('.stop-guide-btn:not(.near)').forEach(b => b.addEventListener('click', () => {
    openStopArticles(b.dataset.stopKey, day.date, Number(b.dataset.stopIndex));
  }));
  el.querySelectorAll('.stop-guide-btn.near').forEach(b => b.addEventListener('click', () => {
    STATE.articleReturn = { screen: 'trip', scrollY: window.scrollY };
    location.hash = `#near/${encodeURIComponent(b.dataset.nearDate)}/${b.dataset.nearOrder}`;
  }));
  applyPastState(dayIndex);
}

// 今日の画面だけ、終わった予定を薄く・いまの予定を強調する
function applyPastState(dayIndex) {
  const day = TRIP[dayIndex];
  const isToday = day && day.date === todayStr();
  const { list, current, n } = day ? nowNext(day) : { list: [], current: null, n: 0 };
  const stopDone = new Map();
  list.forEach(x => {
    const elm = document.querySelector(`#timeline .item[data-si="${x.si}"][data-ii="${x.ii}"]`);
    const past = isToday && x.effEnd != null && x.effEnd <= n;
    if (elm) {
      elm.classList.toggle('past', past);
      elm.classList.toggle('current', isToday && current === x);
    }
    stopDone.set(x.si, (stopDone.has(x.si) ? stopDone.get(x.si) : true) && past);
  });
  stopDone.forEach((done, si) => {
    const st = document.getElementById(`stop-${si}`);
    if (st) {
      st.classList.toggle('past', done);
      st.classList.toggle('cur', !!(isToday && current && current.si === si));
    }
    // 終わった地点から出た区間・その地点のガイド行も、路線の色を通過済みにする
    const leg = document.getElementById(`leg-${si + 1}`);
    if (leg) leg.classList.toggle('past', done);
    document.querySelectorAll(`#timeline .guide-row[data-si="${si}"]`).forEach(g => g.classList.toggle('past', done));
  });
}

function renderNextCard(dayIndex) {
  const el = document.getElementById('nextCard');
  const day = TRIP[dayIndex];
  if (dayIndex < 0 || !day || day.date !== todayStr()) { el.hidden = true; el.innerHTML = ''; return; }
  const { current, next, n } = nowNext(day);
  let html = '';
  if (current) {
    html += `<div class="nowline"><b>いま</b><span class="n">${escapeHtml(current.it.start)}${current.it.end ? '–' + escapeHtml(current.it.end) : ''}</span><span>${escapeHtml(current.it.act)}</span></div>`;
  }
  if (next) {
    // 次の予定は切符の形で見せる（大きな時刻・行き先・移動手段、半券に残り時間）
    const move = next.ii === 0 && next.si > 0 ? next.s.arrive_move : next.it.move;
    const ml = moveLabel(move);
    const kind = classifyMove(move);
    const nav = navUrl(next.s);
    const left = Math.max(0, next.start - n);
    const h = Math.floor(left / 60), m = left % 60;
    const stub = h ? `<span><span class="n">${h}</span><span class="u">時間</span></span><span><span class="n">${m}</span><span class="u">分</span></span>`
                   : `<span><span class="n">${m}</span><span class="u">分</span></span>`;
    html += `<div class="ticket">
      <div class="t-main">
        <div class="t-label">次の予定</div>
        <div class="t-time">${escapeHtml(next.it.start)}</div>
        <div class="t-act">${escapeHtml(next.it.act)}</div>
        <div class="t-mode">${ml ? `${moveIcon(kind, move)}<span>${next.s.name.includes(ml) ? '' : escapeHtml(ml) + 'で'}${escapeHtml(next.s.name)}へ</span>` : `${svgIcon('route')}<span>${escapeHtml(next.s.name)}</span>`}</div>
      </div>
      <div class="t-stub" aria-label="${fmtUntil(left)}"><small>あと</small>${stub}</div>
      <div class="t-actions">
        ${nav ? `<a class="btn primary" href="${escapeHtml(nav)}" target="_blank" rel="noopener">${svgIcon('open')}Googleマップで開く</a>` : ''}
        <button type="button" class="btn ghost" data-goto-stop-index="${next.si}">予定を見る</button>
      </div>
    </div>`;
  } else {
    const tomorrow = TRIP[dayIndex + 1];
    const t1 = tomorrow ? flattenItems(tomorrow).find(x => x.start != null) : null;
    html += `<div class="dayend">今日の予定はここまでです。おつかれさまでした。
      ${t1 ? `<p>明日は <span class="n">${escapeHtml(t1.it.start)}</span> ${escapeHtml(t1.it.act)} から</p>` : ''}
    </div>`;
  }
  el.innerHTML = html;
  el.hidden = false;
  const b = el.querySelector('[data-goto-stop-index]');
  if (b) b.addEventListener('click', () => scrollToStop(Number(b.dataset.gotoStopIndex)));
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ============ 5. 全体（旅の概要・出発前に確認すること・日別一覧） ============ */
function collectActionables() {
  const out = [];
  TRIP.forEach((d, di) => d.stops.forEach((s, si) => s.items.forEach(it => {
    const tags = itemTags(it).filter(t => t[0] === 'alert' || t[0] === 'warn');
    if (tags.length) out.push({ di, si, d, it, tags });
  })));
  return out;
}

function drawOverviewMap() {
  clearMap();
  if (!map || !mapReady) return;
  // 陸路は実線、空路は点線。宿泊地（路線図の駅）に都市名の札を立てる
  TRIP.forEach(day => {
    const p = day.stops;
    for (let k = 1; k < p.length; k++) {
      const fly = classifyMove(p[k].arrive_move) === 'flight';
      addLine([[p[k - 1].lat, p[k - 1].lon], [p[k].lat, p[k].lon]], { color: '#0F6E6A', weight: fly ? 2 : 3, opacity: .9, dashArray: fly ? [2, 2] : null });
    }
  });
  nightStations().forEach(st => {
    if (st.lat == null) return;
    const el = document.createElement('div');
    el.className = 'pin day';
    el.textContent = st.name;
    addMarker(st.lat, st.lon, el, null, () => { if (!mapFull) renderDay(Math.max(0, st.fromDay)); });
  });
  refitCurrentMap();
}

function renderOverview(opts) {
  opts = opts || {};
  const myGen = ++renderGeneration; // 進行中のrenderDay()の非同期更新を無効化する
  activeDayIndex = -1;
  updateRailActive();
  const first = TRIP[0];
  const ph = tripPhase();
  const ti = todayIndex();

  // 旅の路線図：宿泊地を駅に見立て、通過した駅・今夜の駅・空路（点線）を示す
  const stations = nightStations();
  const curStation = ph.phase === 'during' ? stations.findIndex(st => ti >= st.fromDay && ti <= st.toDay && !st.end && st.nights > 0) : -1;
  const stState = k => {
    if (ph.phase === 'after') return 'done';
    if (ph.phase !== 'during') return '';
    if (k === curStation) return 'cur';
    if (curStation >= 0 ? k < curStation : stations[k].toDay < ti) return 'done';
    return '';
  };
  const rmap = stations.map((st, k) => {
    const s = stState(k);
    const segIn = k > 0 ? `<span class="l${st.fly ? ' fly' : ''}${s === 'done' || s === 'cur' ? ' done' : ''}"></span>` : '';
    const nxt = stations[k + 1];
    const segOut = nxt ? `<span class="r${nxt.fly ? ' fly' : ''}${s === 'done' && stState(k + 1) !== '' ? ' done' : ''}"></span>` : '';
    return `<div class="st ${s}">${segIn}${segOut}<i></i><b>${escapeHtml(st.name)}</b><small><span class="n">${escapeHtml(mdOf(st.date))}</span>${st.nights ? `<br>${st.nights}泊` : ''}</small></div>`;
  }).join('');

  let status = '';
  if (ph.phase === 'before') status = `<div class="ov-status"><span>出発まで<span class="n">${ph.days}</span>日</span></div>`;
  else if (ph.phase === 'during' && ti >= 0) status = `<div class="ov-status"><span>今日は<span class="n">${ti + 1}</span>日目、${escapeHtml(nightCityOf(TRIP[ti]) || '')}</span><button type="button" class="btn primary" data-open-day="${ti}">今日の予定</button></div>`;
  else if (ph.phase === 'after') status = `<div class="ov-status"><span>おかえりなさい。旅は終わりました。</span></div>`;
  document.getElementById('dayHead').innerHTML = `
    <h2 class="ov-title">${escapeHtml(TRIP_NAME)}</h2>
    <p class="ov-period"><span class="n">${escapeHtml(mdOf(first.date))}</span>（${escapeHtml(first.dow)}）から<span class="n">${TRIP.length}</span>日間</p>
    <div class="rmap" role="img" aria-label="旅の行程：${escapeHtml(stations.map(s => s.name).join('、'))}">${rmap}</div>
    ${status}`;
  document.getElementById('nextCard').hidden = true;

  // 確認・手配が必要な予定（要予約・要手配・要確認）
  const todos = collectActionables();
  const prep = document.getElementById('prepBox');
  if (todos.length) {
    prep.hidden = false;
    prep.open = false; // 件数だけ見せて畳んでおく（開くと地図・日別一覧が画面外に押し出されるため）
    prep.innerHTML = `<summary>確認・手配が必要な予定 <span class="n">${todos.length}</span>件</summary>` + todos.map(x => `
      <div class="prep-row" data-open-day="${x.di}" data-stop-index="${x.si}">
        <span class="pr-date"><span class="n">${escapeHtml(mdOf(x.d.date))}</span>${escapeHtml(x.d.dow)}　${escapeHtml(x.it.start || '')}</span>
        <span class="pr-main">${escapeHtml(x.it.act)}<div class="tags">${x.tags.map(t => `<span class="tag ${t[0]}">${escapeHtml(t[1])}</span>`).join('')}</div></span>
      </div>`).join('');
  } else {
    prep.hidden = true;
  }

  // 日別の時刻表（日付・見出し・ひと言。予報が出ている日は天気）
  document.getElementById('timeline').innerHTML = `<ol class="days">` + TRIP.map((d, di) => {
    const st = ph.phase === 'after' || (ph.phase === 'during' && di < ti) ? ' done' : (di === ti ? ' cur' : '');
    return `<li class="dayrow${st}" data-open-day="${di}">
      <time><span class="n">${escapeHtml(mdOf(d.date))}</span><small>${di === ti ? '今日' : escapeHtml(d.dow)}</small></time>
      <div><b>${escapeHtml(shortTitle(di))}</b><p>${escapeHtml(shortHighlight(di))}</p></div>
      <div class="dc-wx" id="dcwx-${di}"></div>
    </li>`;
  }).join('') + `</ol>`;

  document.querySelectorAll('#screenTrip [data-open-day]').forEach(elm => {
    elm.addEventListener('click', () => {
      const di = Number(elm.dataset.openDay);
      renderDay(di);
      if (elm.dataset.stopIndex != null) setTimeout(() => scrollToStop(Number(elm.dataset.stopIndex)), 80);
    });
  });

  document.getElementById('mapWrap').classList.add('ov');
  const boundsPts = [];
  TRIP.forEach(d => d.stops.forEach(s => boundsPts.push([s.lat, s.lon])));
  currentView = { type: 'ov', boundsPts };
  if (map && mapReady) map.resize();
  drawCurrentMap();
  if (!opts.keepScroll) window.scrollTo(0, 0);

  // 予報が出ている日だけ、カードに天気を添える
  TRIP.forEach(async (d, di) => {
    const diff = Math.round((parseDayDate(d.date) - toDateOnly(new Date())) / 86400000);
    if (diff < 0 || diff > WX_FORECAST_MAX_DAYS || !d.weather) return;
    const wx = await fetchWeather(d);
    if (myGen !== renderGeneration || wx.status !== 'ok') return;
    const cell = document.getElementById(`dcwx-${di}`);
    if (cell) cell.innerHTML = `${wxIconHtml(wx.code)}<span class="n">${Math.round(wx.tmax)}°/${Math.round(wx.tmin)}°</span>`;
  });
}

/* ============ 8. ガイド：検索・章目次・記事一覧 ============ */
function normalizeQuery(str) {
  return String(str || "")
    .toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .trim();
}
// 検索の同義語（ひらがな読み → 別表記）。旅行ごとに書き換える。例: "げる": ["ger", "ゲル"]
const SYNONYMS = {
};
function expandQueryTerms(q) {
  const terms = new Set([q]);
  const syn = SYNONYMS[q];
  if (syn) syn.forEach(s => terms.add(normalizeQuery(s)));
  return Array.from(terms);
}
function articleSearchText(a) {
  const secText = (a.sections || []).map(s => JSON.stringify(s)).join(' ');
  return normalizeQuery([a.title, ...(a.aliases || []), ...(a.quickPoints || []), secText].join(' '));
}
function searchArticles(rawQuery) {
  const q = normalizeQuery(rawQuery);
  if (!q) return [];
  const terms = expandQueryTerms(q);
  const scored = [];
  GUIDE.articles.forEach(a => {
    const titleNorm = normalizeQuery(a.title);
    const aliasNorm = (a.aliases || []).map(normalizeQuery);
    const bodyText = articleSearchText(a);
    let score = 0;
    terms.forEach(t => {
      if (!t) return;
      if (titleNorm.includes(t)) score += 10;
      if (aliasNorm.some(al => al.includes(t))) score += 6;
      if (bodyText.includes(t)) score += 1;
    });
    if (score > 0) scored.push({ a, score });
  });
  scored.sort((x, y) => y.score - x.score);
  return scored.map(x => x.a);
}

function dayLabel(dayIds) {
  if (!dayIds || !dayIds.length) return "";
  return dayIds.map(d => {
    const idx = TRIP.findIndex(t => t.date === d);
    return idx >= 0 ? `Day${idx + 1}` : d;
  }).join('・');
}
function verifBadge(v) {
  const label = { confirmed: "確認済み", "needs-recheck": "要再確認", unconfirmed: "未確認", draft: "下書き" }[v.status] || v.status;
  return `<span class="a-badge v-${v.status}">${label}</span>`;
}
/* ---- 候補カタログ：記事の catalog（種類・必見/必食・営業日・位置）から、旅程を決めるための情報を出す ---- */
const KIND_LABEL = { food: '食事', sweets: '甘味・飲み物', market: '市場', night: '夜市', sight: '観光', walk: '街歩き', arch: '建築', nature: '自然・景色', shop: '買い物', cafe: 'カフェ' };
const KIND_GROUP = { food: 'eat', sweets: 'eat', market: 'eat', night: 'eat', sight: 'see', walk: 'see', arch: 'see', nature: 'see', shop: 'shop', cafe: 'shop' };
function isInPlan(a) { return !!(a.catalog && a.catalog.plan === 'in') || !!(a.stopRefs && a.stopRefs.length); }
function mustLabel(a) {
  if (!a.catalog || !a.catalog.must) return '';
  return (KIND_GROUP[a.catalog.kind] === 'eat' || a.catalog.kind === 'cafe') ? '必食' : '必見';
}
// その記事のエリアに滞在する日ごとに、営業しているか（定休日・営業曜日から判定）
function openOn(a, date) {
  const cat = a.catalog;
  const day = TRIP.find(t => t.date === date);
  if (!cat || !day) return null;
  if (cat.openDays && cat.openDays.length) return cat.openDays.includes(day.dow);
  if (cat.closed && cat.closed.length) return !cat.closed.includes(day.dow);
  return true;
}
function daysChips(a) {
  const c = CHAPTER_BY_ID.get(a.chapterId);
  const ds = (c && c.days) || [];
  if (!a.catalog || !ds.length) return '';
  return ds.map(d => {
    const ok = openOn(a, d);
    const day = TRIP.find(t => t.date === d);
    return `<span class="dchip ${ok ? 'ok' : 'ng'}" title="${ok ? '営業日' : '定休日・営業日外'}">${escapeHtml(mdOf(d))}${day ? escapeHtml(day.dow) : ''}${ok ? '' : '休'}</span>`;
  }).join('');
}
function nearestStop(a) {
  const g = a.catalog && a.catalog.geo;
  if (!g) return null;
  let best = null;
  TRIP.forEach((day, di) => day.stops.forEach((s, si) => {
    const d = haversineKm(g[0], g[1], s.lat, s.lon);
    if (!best || d < best.d) best = { d, di, si, s, day };
  }));
  return best;
}
function walkHint(km) { return km < 1 ? `約${Math.max(10, Math.round(km * 100) * 10)}m・徒歩${Math.max(1, Math.round(km * 1.3 / 4.5 * 60))}分` : `約${km.toFixed(1)}km`; }
function catalogMetaHtml(a) {
  const cat = a.catalog;
  const must = mustLabel(a);
  return `<span class="kind">${escapeHtml(KIND_LABEL[cat.kind] || cat.kind || '')}</span>`
    + `<span class="plan ${isInPlan(a) ? 'in' : 'cand'}">${isInPlan(a) ? '旅程にあり' : '寄り道候補'}</span>`
    + (must ? `<span class="must">${must}</span>` : '')
    + `<span class="dchips">${daysChips(a)}</span>`;
}
function articleRowHtml(a) {
  if (a.catalog) {
    return `<div class="article-row cat-row-item" data-article="${a.id}">
      <div class="a-main">
        <div class="a-title">${escapeHtml(a.title)}</div>
        ${a.quickPoints && a.quickPoints[0] ? `<div class="a-lead">${escapeHtml(a.quickPoints[0])}</div>` : ''}
        <div class="a-meta cat-meta">${catalogMetaHtml(a)}</div>
      </div>
      <div class="a-arrow" aria-hidden="true">›</div>
    </div>`;
  }
  return `<div class="article-row" data-article="${a.id}">
    <div class="a-main">
      <div class="a-title">${escapeHtml(a.title)}</div>
      <div class="a-meta">${escapeHtml(dayLabel(a.dayIds))}${a.dayIds && a.dayIds.length ? '　' : ''}約${a.readMinutes}分${verifBadge(a.verification)}</div>
    </div>
    <div class="a-arrow">›</div>
  </div>`;
}
// 記事本文の冒頭に出す「旅程を決めるための情報」
function catalogBoxHtml(a) {
  const cat = a.catalog;
  if (!cat) return '';
  let where = '';
  if (a.stopRefs && a.stopRefs.length) {
    const ref = a.stopRefs[0];
    const di = TRIP.findIndex(t => t.date === ref.date);
    const day = TRIP[di];
    const si = day ? day.stops.findIndex(s => s.order === ref.order) : -1;
    if (day && si >= 0) where = `旅程：${escapeHtml(mdOf(day.date))}（${escapeHtml(day.dow)}）の<span class="n">${si + 1}</span> ${escapeHtml(day.stops[si].name)}`;
  } else if (isInPlan(a) && cat.planNote) {
    where = `旅程：${escapeHtml(cat.planNote)}`;
  }
  if (!where) {
    const near = nearestStop(a);
    if (near) where = near.d < 5
      ? `旅程の ${escapeHtml(mdOf(near.day.date))}（${escapeHtml(near.day.dow)}）<span class="n">${near.si + 1}</span> ${escapeHtml(near.s.name)} から${walkHint(near.d)}`
      : `旅程からは離れています（最寄り：${escapeHtml(near.s.name)}から約${near.d.toFixed(0)}km）`;
  }
  const nav = cat.nav ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(cat.nav) : null;
  return `<div class="cat-box">
    <div class="cat-line">${catalogMetaHtml(a)}</div>
    ${where ? `<div class="cat-line">${where}</div>` : ''}
    <dl class="cat-dl">
      ${cat.hours ? `<dt>営業</dt><dd>${escapeHtml(cat.hours)}${cat.closed && cat.closed.length ? `（${escapeHtml(cat.closed.join('・'))}曜休み）` : ''}${cat.openDays && cat.openDays.length ? `（${escapeHtml(cat.openDays.join('・'))}曜のみ）` : ''}</dd>` : ''}
      ${cat.duration ? `<dt>目安</dt><dd>${escapeHtml(cat.duration)}${cat.price ? `・${escapeHtml(cat.price)}` : ''}</dd>` : ''}
      ${cat.fit ? `<dt>旅程と</dt><dd>${escapeHtml(cat.fit)}</dd>` : ''}
    </dl>
    ${nav ? `<a class="btn ghost cat-nav" href="${escapeHtml(nav)}" target="_blank" rel="noopener">${svgIcon('open')}Googleマップで開く</a>` : ''}
  </div>`;
}
// 旅程の地点の近く（徒歩圏）にある寄り道候補。
// 同じ日に近い地点が続く街なかで同じ候補が何度も出ないよう、候補はその日の「いちばん近い地点」1か所にだけ付ける
const NEAR_KM = 0.8;
function dayNearMap(day) {
  const byOrder = new Map();
  GUIDE.articles.filter(a => a.catalog && a.catalog.geo && !isInPlan(a)).forEach(a => {
    let best = null;
    day.stops.forEach(s => {
      const d = haversineKm(s.lat, s.lon, a.catalog.geo[0], a.catalog.geo[1]);
      if (d <= NEAR_KM && (!best || d < best.d)) best = { s, d };
    });
    if (!best) return;
    if (!byOrder.has(best.s.order)) byOrder.set(best.s.order, []);
    byOrder.get(best.s.order).push({ a, d: best.d });
  });
  byOrder.forEach(list => list.sort((x, y) => x.d - y.d));
  return byOrder;
}

function todayGuideDayIndex() {
  // 端末の現地日付（スマホは渡航先で自動的に時差を切り替える）を基準に、旅行期間内なら該当日、期間外ならDay1、選択中の日があればそれを優先する
  if (activeDayIndex >= 0) return activeDayIndex;
  const now = new Date();
  const isoToday = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;
  const idx = TRIP.findIndex(t => t.date === isoToday);
  return idx >= 0 ? idx : 0;
}

function renderSection(sec) {
  switch (sec.type) {
    case 'quick30':
      return `<div class="sec-quick30"><div class="qtitle">現地で30秒</div><ul>${sec.points.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul></div>`;
    case 'image': {
      const im = IMAGE_BY_ID.get(sec.imageId);
      if (!im) return '';
      const src = im.src640 ? './' + im.src640 : '';
      const srcset = (im.src640 && im.src960) ? `./${im.src640} 640w, ./${im.src960} 960w` : '';
      if (!src) return `<div class="sec-image"><div class="cap">（画像は生成・選定後に反映されます）</div></div>`;
      return `<div class="sec-image">
        <img src="${src}" ${srcset ? `srcset="${srcset}" sizes="(min-width:880px) 720px, 100vw"` : ''} width="${im.width || ''}" height="${im.height || ''}" loading="lazy" alt="${escapeHtml(im.alt)}">
        <div class="cap"><b>AI生成イメージ</b>・${escapeHtml(im.caption)}</div>
      </div>`;
    }
    case 'seeThis':
      return `<div class="sec-seeThis"><div class="stitle">ここを見る</div>${sec.points.map(p => `<div class="point"><div class="p-name">${escapeHtml(p.point)}</div><div class="p-mean">${escapeHtml(p.meaning)}</div></div>`).join('')}</div>`;
    case 'background':
      return `<div class="sec-background"><div class="btitle">背景を3分で</div>${sec.paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('')}</div>`;
    case 'checkBeforeVisit':
      return `<div class="sec-checkBeforeVisit"><div class="ctitle">訪問前に確認</div><ul>${sec.items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul></div>`;
    case 'askGuide':
      return `<div class="sec-askGuide"><div class="qlabel">ガイドに聞いてみる</div>「${escapeHtml(sec.question)}」</div>`;
    case 'note':
      return `<div class="sec-note">${escapeHtml(sec.text)}</div>`;
    case 'card':
      return `<div class="sec-card">${escapeHtml(sec.body)}</div>`;
    case 'figure': {
      const fig = FIGURE_BY_ID.get(sec.figureId);
      if (!fig) return '';
      // SVGはfigures.py側で固定文字列として定義された安全なものだけを扱う（外部・ユーザー由来のHTMLは混ぜない）
      return `<div class="sec-figure">${fig.svg}<div class="cap">${escapeHtml(fig.alt)}</div></div>`;
    }
    case 'phrasebook':
      return renderPhrasebookBlock();
    default:
      return '';
  }
}

function renderPhrasebookBlock() {
  const order = ['greeting', 'courtesy', 'question', 'practical', 'number', 'emergency'];
  const byCat = new Map();

/* ============ 11. オフライン（Service Worker連携） ============ */
// 旅程そのものは自動で端末に保存する（sw.jsを起動時に登録）。ガイドの画像は「旅行用に保存する」でまとめて保存する。
const SW_SCOPE_OK = ('serviceWorker' in navigator);
// sw.js の CACHE_PREFIX（templates/sw_template.js）と同じ値にする
const GUIDE_CACHE_PREFIX = 'tabi-shiori-taiwan-okinawa-';
function registerServiceWorker() {
  if (!SW_SCOPE_OK) return;
  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!secure) return;
  navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(e => console.warn('Service Workerを登録できませんでした', e));
}
async function refreshOfflineStatus() {
  const el = document.getElementById('offlineStatus');
  if (!el) return;
  if (!SW_SCOPE_OK || typeof caches === 'undefined') { el.textContent = 'この端末・ブラウザでは利用できません'; return; }
  try {
    const keys = (await caches.keys()).filter(k => k.startsWith(GUIDE_CACHE_PREFIX));
    let saved = false;
    for (const k of keys) {
      const c = await caches.open(k);
      if (await c.match('./index.html') || await c.match('./')) { saved = true; break; }
    }
    el.textContent = saved
      ? '旅程は端末に保存済みです。電波がなくても旅程を表示できます（地図・天気・経路は除く）。'
      : 'まだ保存されていません。電波のある場所で一度開くと自動で保存されます。';
  } catch (e) {
    el.textContent = '保存状態を確認できませんでした';
  }
}
function updateOnlineBanner() {
  document.getElementById('offlineBanner').hidden = navigator.onLine !== false;
  updateStickyH();
}

  updateOnlineBanner();
  // 電波が戻ったら本物の地図に、切れたら略地図に切り替える

}
window.addEventListener('online', onConnectivityChange);
window.addEventListener('offline', onConnectivityChange);

    return;
  }

    <div class="save-status" id="saveOfflineStatus"></div>`;
